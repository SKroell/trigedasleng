<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Trigedasleng</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --fg: #1a1a1a;
        --muted: rgba(0, 0, 0, 0.6);
        --border: rgba(0, 0, 0, 0.1);
        --btn-bg: #1a1a1a;
        --btn-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f2f2f2;
          --muted: rgba(255, 255, 255, 0.62);
          --border: rgba(255, 255, 255, 0.12);
          --btn-bg: #ededed;
          --btn-fg: #161616;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        padding: 40px 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg);
      }
      .glyph {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 700;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); }
      button {
        border: none;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 10px 22px;
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--btn-fg);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="glyph" aria-hidden="true">T</div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Reconnect to the
        internet, or revisit a page you've already opened.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
